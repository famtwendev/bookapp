server:
  port: 8888

app:
  api-prefix: /api
  version: /v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}${app.version}/identity/**
          filters:
            - StripPrefix=2
        - id: profile-service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}${app.version}/profile/users/**
          filters:
            - StripPrefix=2
